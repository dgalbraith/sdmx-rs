[package]
name = "sdmx-client"
version = "0.0.0"
edition.workspace = true
rust-version = "1.92.0"
authors.workspace = true
description = "Future home of the async HTTP client for sdmx-rs; no functionality is published at this version."
readme = "README.md"
categories = ["web-programming::http-client"]
keywords = ["sdmx", "http", "client", "async", "api"]
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
sdmx-types = { version = "=0.0.0", path = "../sdmx-types" }
sdmx-parsers = { version = "=0.0.0", path = "../sdmx-parsers" }
tokio = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

# TLS configuration.
#
# The tls flag is forward-declared: it takes effect when the client
# implementation lands. TLS will be rustls-only; the backend is not a user
# choice, so the single `tls` flag is on/off only.
[features]
default = ["tls"]
tls = ["reqwest/rustls"]
# blocking = []   # blocking API bridge (planned)

[dev-dependencies]
wiremock = { workspace = true }

# Scaffold: all dependencies suppressed until implementation begins.
# Remove each entry here as it is actively used — machete will then flag genuine dead deps.
[package.metadata.cargo-machete]
ignored = [
  "sdmx-types",   # Phase 2: depends on core types; unignore when integrated
  "sdmx-parsers", # Phase 2: depends on parsers; unignore when integrated
  "tokio",        # Phase 3: async runtime for HTTP client
  "reqwest",      # Phase 3: HTTP client library
  "thiserror",    # Phase 1: error type definitions
  "url",          # Phase 3: URL parsing and validation for endpoint builders
  "wiremock",     # Phase 3: HTTP mocking for integration tests
]
