[package]
name = "sdmx-client"
version = "0.0.0"
edition.workspace = true
rust-version = "1.92.0"
authors.workspace = true
description = "Future home of the async HTTP client for sdmx-rs; no functionality is published at this version."
readme = "README.md"
categories = ["web-programming::http-client"]
keywords = ["sdmx", "http", "client", "async", "api"]
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
sdmx-types = { version = "=0.0.0", path = "../sdmx-types" }
sdmx-parsers = { version = "=0.0.0", path = "../sdmx-parsers" }

# TLS configuration.
#
# The tls flag is forward-declared: it takes effect when the client
# implementation lands. TLS will be rustls-only; the backend is not a user
# choice, so the single `tls` flag is on/off only.
[features]
default = ["tls"]
tls = []
# blocking = []   # blocking API bridge (planned)
